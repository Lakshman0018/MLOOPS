groups:
  - name: wine-quality-api-alerts
    rules:
      - alert: WineQualityAPIClientErrors
        expr: sum(rate(wine_quality_api_http_requests_total{status=~"4.."}[2m])) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Wine Quality API is receiving client errors"
          description: "4xx responses have been observed during the recent window."

      - alert: WineQualityAPIDown
        expr: up{job="wine-quality-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Wine Quality API monitoring target is down"
          description: "Prometheus cannot scrape the deployed /metrics endpoint."
