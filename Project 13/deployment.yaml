apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-quality-prediction
  labels:
    app: wine-quality-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wine-quality-prediction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wine-quality-prediction
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: wine-quality-api
          image: ghcr.io/lakshman0018/wine-quality-ml:project12-54407660342573cd943e95918fe80189cb6fb010
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
