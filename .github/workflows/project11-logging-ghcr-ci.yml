name: Wine Quality - Project 11 Logging CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wine-quality-ml

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: Project 11
      - name: Train Wine Quality model
        run: python train_model.py
        working-directory: Project 11
      - name: Check ML quality gate
        run: python quality_gate.py
        working-directory: Project 11
      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline.py -v
        working-directory: Project 11
      - name: Run logging application tests
        run: python -m unittest test_app.py -v
        working-directory: Project 11
      - name: Build Docker image
        run: docker build -t wine-quality-ml:project11 .
        working-directory: Project 11
      - name: Start test container
        run: |
          docker run -d --name wine-quality-project11 -p 5000:5000 wine-quality-ml:project11
      - name: Test health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 3
          done
          docker logs wine-quality-project11
          exit 1
      - name: Test valid prediction
        run: |
          response=$(curl --fail --silent --show-error -X POST -H "Content-Type: application/json" -H "X-Request-ID: ci-valid-001" -d '{"fixed acidity":7.9,"volatile acidity":0.35,"citric acid":0.46,"residual sugar":3.6,"chlorides":0.078,"free sulfur dioxide":15,"total sulfur dioxide":37,"density":0.9973,"pH":3.35,"sulphates":0.86,"alcohol":12.8}' http://127.0.0.1:5000/predict)
          echo "$response" | grep -q '"prediction"'
      - name: Test validation error tracking
        run: |
          status=$(curl --silent --output /tmp/invalid.json --write-out "%{http_code}" -X POST -H "Content-Type: application/json" -H "X-Request-ID: ci-invalid-001" -d '{"fixed acidity":7.9}' http://127.0.0.1:5000/predict)
          test "$status" = "400"
      - name: Test missing route tracking
        run: |
          status=$(curl --silent --output /tmp/not-found.json --write-out "%{http_code}" -H "X-Request-ID: ci-404-001" http://127.0.0.1:5000/not-a-real-route)
          test "$status" = "404"
      - name: Verify logging events
        run: |
          logs=$(docker logs wine-quality-project11 2>&1)
          echo "$logs"
          echo "$logs" | grep -q "event=model_loaded"
          echo "$logs" | grep -q "event=prediction_success"
          echo "$logs" | grep -q "event=validation_error"
          echo "$logs" | grep -q "status=404"
      - name: Show Docker logs
        if: always()
        run: docker logs wine-quality-project11 || true
      - name: Remove test container
        if: always()
        run: docker rm -f wine-quality-project11 || true
      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Tag tested image
        run: |
          docker tag wine-quality-ml:project11 "$IMAGE_ID:latest"
          docker tag wine-quality-ml:project11 "$IMAGE_ID:project11-${{ github.sha }}"
      - name: Push tested image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:project11-${{ github.sha }}"
