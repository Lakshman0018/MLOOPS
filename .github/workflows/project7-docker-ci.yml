name: Wine Quality ML Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: Project 7
      - name: Train Wine Quality model
        run: python train_model.py
        working-directory: Project 7
      - name: Check ML quality gate
        run: python quality_gate.py
        working-directory: Project 7
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v
        working-directory: Project 7
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v
        working-directory: Project 7
      - name: Build Docker image
        run: docker build -t wine-quality-ml:${{ github.sha }} .
        working-directory: Project 7
      - name: Start Docker container
        run: docker run -d --name wine-quality-ml-container -p 5000:5000 wine-quality-ml:${{ github.sha }}
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become ready."
          docker logs wine-quality-ml-container
          exit 1
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error -X POST -H "Content-Type: application/json" -d '{"fixed acidity":7.9,"volatile acidity":0.35,"citric acid":0.46,"residual sugar":3.6,"chlorides":0.078,"free sulfur dioxide":15,"total sulfur dioxide":37,"density":0.9973,"pH":3.35,"sulphates":0.86,"alcohol":12.8}' http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'
      - name: Show Docker container logs
        if: always()
        run: docker logs wine-quality-ml-container || true
      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f wine-quality-ml-container || true
