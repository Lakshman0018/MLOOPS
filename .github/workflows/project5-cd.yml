name: Wine Quality ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: Project 5

      - name: Train Wine Quality model
        run: python train_model.py
        working-directory: Project 5

      - name: Check ML quality gate
        run: python quality_gate.py
        working-directory: Project 5

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v
        working-directory: Project 5

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v
        working-directory: Project 5

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp wine_quality_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Wine Quality Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt
        working-directory: Project 5

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-ml-release
          path: Project 5/release_candidate/
          if-no-files-found: error
          retention-days: 7
