name: Wine Quality ML Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-quality-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt
        working-directory: Project 4

      - name: Train Wine Quality model
        run: python train_model.py
        working-directory: Project 4

      - name: Check ML quality gate
        run: python quality_gate.py
        working-directory: Project 4

      - name: Run automated ML tests
        run: python -m unittest discover -v
        working-directory: Project 4

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-artifacts
          path: |
            Project 4/wine_quality_model.pkl
            Project 4/metrics.json
            Project 4/student_results.csv
          if-no-files-found: error
          retention-days: 7
