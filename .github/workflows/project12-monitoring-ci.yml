name: Project 12 - Wine Quality Monitoring CI

on:
  push:
    branches:
      - main
    paths:
      - "Project 12/**"
      - ".github/workflows/project12-monitoring-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Project 12/**"
      - ".github/workflows/project12-monitoring-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wine-quality-ml

jobs:
  monitoring-build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
        working-directory: Project 12

      - name: Train Wine Quality model
        run: python train_model.py
        working-directory: Project 12

      - name: Check ML quality gate
        run: python quality_gate.py
        working-directory: Project 12

      - name: Run ML tests
        run: python -m unittest test_ml_pipeline.py -v
        working-directory: Project 12

      - name: Run application and monitoring tests
        run: python -m unittest test_app.py -v
        working-directory: Project 12

      - name: Build Docker image
        run: docker build -t wine-quality-ml:project12 .
        working-directory: Project 12

      - name: Start monitoring-enabled container
        run: docker run -d --name wine-quality-project12 -p 5000:5000 wine-quality-ml:project12

      - name: Wait for health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 3
          done
          docker logs wine-quality-project12
          exit 1

      - name: Verify metrics endpoint
        run: |
          curl --fail --silent http://127.0.0.1:5000/metrics | tee /tmp/metrics.txt
          grep -q "wine_quality_api_model_loaded" /tmp/metrics.txt
          grep -q "wine_quality_api_http_requests_total" /tmp/metrics.txt
          grep -q "wine_quality_api_http_request_duration_seconds" /tmp/metrics.txt
          grep -q "wine_quality_api_predictions_total" /tmp/metrics.txt

      - name: Verify prediction and metrics
        run: |
          response=$(curl --fail --silent --show-error             -X POST             -H "Content-Type: application/json"             -H "X-Request-ID: ci-project12-001"             -d '{"fixed acidity":7.9,"volatile acidity":0.35,"citric acid":0.46,"residual sugar":3.6,"chlorides":0.078,"free sulfur dioxide":15,"total sulfur dioxide":37,"density":0.9973,"pH":3.35,"sulphates":0.86,"alcohol":12.8}'             http://127.0.0.1:5000/predict)
          echo "$response"
          echo "$response" | grep -q '"prediction"'
          curl --fail --silent http://127.0.0.1:5000/metrics | grep -q 'wine_quality_api_predictions_total{result="success"}'

      - name: Verify validation and 404 metrics
        run: |
          status=$(curl --silent --output /tmp/invalid.json --write-out "%{http_code}"             -X POST             -H "Content-Type: application/json"             -d '{"fixed acidity":7.9}'             http://127.0.0.1:5000/predict)
          test "$status" = "400"
          status=$(curl --silent --output /tmp/not-found.json --write-out "%{http_code}"             http://127.0.0.1:5000/not-a-real-route)
          test "$status" = "404"
          curl --fail --silent http://127.0.0.1:5000/metrics | grep -q 'status="400"'
          curl --fail --silent http://127.0.0.1:5000/metrics | grep -q 'status="404"'

      - name: Verify application logging
        run: |
          docker logs wine-quality-project12 2>&1 | tee /tmp/project12-logs.txt
          grep -q "event=model_loaded" /tmp/project12-logs.txt
          grep -q "event=prediction_success" /tmp/project12-logs.txt
          grep -q "event=validation_error" /tmp/project12-logs.txt

      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project12-monitoring-evidence
          path: |
            /tmp/metrics.txt
            /tmp/project12-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs
        if: always()
        run: docker logs wine-quality-project12 || true

      - name: Remove test container
        if: always()
        run: docker rm -f wine-quality-project12 || true

      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Tag Project 12 image
        run: |
          docker tag wine-quality-ml:project12 "$IMAGE_ID:latest"
          docker tag wine-quality-ml:project12 "$IMAGE_ID:project12-${{ github.sha }}"

      - name: Push Project 12 image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:project12-${{ github.sha }}"
