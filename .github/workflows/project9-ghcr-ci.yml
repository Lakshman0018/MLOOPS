name: Wine Quality - Build Test and Publish to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}-wine-quality-ml

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: Project 9

      - name: Train Wine Quality model
        run: python train_model.py
        working-directory: Project 9

      - name: Check ML quality gate
        run: python quality_gate.py
        working-directory: Project 9

      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline.py -v
        working-directory: Project 9

      - name: Run application tests
        run: python -m unittest test_app.py -v
        working-directory: Project 9

      - name: Build Docker image
        run: docker build -t wine-quality-ml:ci .
        working-directory: Project 9

      - name: Start test container
        run: |
          docker run -d \
            --name wine-quality-ci \
            -p 5000:5000 \
            wine-quality-ml:ci

      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for API... attempt $attempt"
            sleep 3
          done
          echo "Health check failed."
          docker logs wine-quality-ci
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"fixed acidity":7.9,"volatile acidity":0.35,"citric acid":0.46,"residual sugar":3.6,"chlorides":0.078,"free sulfur dioxide":15,"total sulfur dioxide":37,"density":0.9973,"pH":3.35,"sulphates":0.86,"alcohol":12.8}' \
            http://127.0.0.1:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs wine-quality-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f wine-quality-ci || true

      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag tested image
        run: |
          docker tag wine-quality-ml:ci "$IMAGE_ID:latest"
          docker tag wine-quality-ml:ci "$IMAGE_ID:sha-${{ github.sha }}"

      - name: Push tested image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${{ github.sha }}"
